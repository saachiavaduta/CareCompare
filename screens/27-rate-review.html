<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate your visit · CareCompare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23123F36'/%3E%3Cg fill='none' stroke='%23C49A45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 19s-6.5-4-8-8C3.1 8.3 4.9 6 7.5 6c1.7 0 3 1 4.5 2.6C13.5 7 14.8 6 16.5 6 19.1 6 20.9 8.3 20 11c-1.5 4-8 8-8 8z'/%3E%3Cpath d='M4 12.5h3.5l1.5-2.5 2.5 5 1.5-2.5H20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/screens.css">
</head>
<body>
  <div class="phone">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="statusbar__island"></span>
      <span class="statusbar__icons">
        <span class="statusbar__signal"><span></span><span></span><span></span><span></span></span>
        <span class="statusbar__wifi"></span>
        <span class="statusbar__battery"></span>
      </span>
    </div>

    <main class="content content--sticky">
      <header class="header">
        <a class="round-button" href="26-visit-summary.html" aria-label="Back">
          <span class="round-button__face"><span class="i i-arrow-left" aria-hidden="true"></span></span>
        </a>
        <h1 class="header__title">Rate your visit</h1>
        <span class="round-button" aria-hidden="true"></span>
      </header>

      <div class="card card--stack">
        <div class="inline-row">
          <span class="photo photo--lg">
            <span class="photo__initials" aria-hidden="true">AR</span>
            <img class="photo__image" src="../images/doctors/rao.jpg" alt="">
          </span>
          <div class="stack-text">
            <span class="title-text">Dr. Anaya Rao</span>
            <span class="small-text muted-text">Cardiologist</span>
          </div>
        </div>
      </div>

      <section class="section">
        <h2 class="section__title">Overall</h2>
        <div class="star-row" role="img" aria-label="4 out of 5 stars">
          <span class="i i-star" aria-hidden="true"></span>
          <span class="i i-star" aria-hidden="true"></span>
          <span class="i i-star" aria-hidden="true"></span>
          <span class="i i-star" aria-hidden="true"></span>
          <span class="i i-star-outline" aria-hidden="true"></span>
        </div>
        <div class="centre-row">
          <span class="caption-text muted-text">Good</span>
        </div>
      </section>

      <div class="card card--stack">
        <div class="rate-row">
          <span class="body-text">Explained clearly</span>
          <span class="stars" role="img" aria-label="5 out of 5">
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
          </span>
        </div>
        <div class="rate-row">
          <span class="body-text">Listened to me</span>
          <span class="stars" role="img" aria-label="4 out of 5">
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star-outline" aria-hidden="true"></span>
          </span>
        </div>
        <div class="rate-row">
          <span class="body-text">Short wait</span>
          <span class="stars" role="img" aria-label="5 out of 5">
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
          </span>
        </div>
        <div class="rate-row">
          <span class="body-text">Value for money</span>
          <span class="stars" role="img" aria-label="4 out of 5">
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star" aria-hidden="true"></span>
            <span class="i i--sm i-star-outline" aria-hidden="true"></span>
          </span>
        </div>
      </div>

      <section class="section">
        <h2 class="section__title">What went well</h2>
        <div class="chip-row chip-row--wrap">
          <span class="chip chip--active"><span class="chip__face">Kind</span></span>
          <span class="chip chip--active"><span class="chip__face">On time</span></span>
          <span class="chip chip--active"><span class="chip__face">Clear advice</span></span>
          <span class="chip"><span class="chip__face">Clean clinic</span></span>
        </div>
      </section>

      <div class="field">
        <label class="field__label" for="review-note">Write a few words (optional)</label>
        <textarea id="review-note" class="textarea" rows="4">Explained my results simply.</textarea>
      </div>

      <span class="check check--checked">
        <span class="check__box"><span class="i i-check" aria-hidden="true"></span></span>
        <span class="check__label">Post without my full name</span>
      </span>
    </main>

    <div class="sticky sticky--floating">
      <a class="btn btn--primary" href="05-home.html">Submit review</a>
    </div>

    <span class="home-indicator" aria-hidden="true"></span>
  </div>
</body>
</html>
