<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splash · CareCompare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23123F36'/%3E%3Cg fill='none' stroke='%23C49A45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 19s-6.5-4-8-8C3.1 8.3 4.9 6 7.5 6c1.7 0 3 1 4.5 2.6C13.5 7 14.8 6 16.5 6 19.1 6 20.9 8.3 20 11c-1.5 4-8 8-8 8z'/%3E%3Cpath d='M4 12.5h3.5l1.5-2.5 2.5 5 1.5-2.5H20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/screens.css">
</head>
<body>
  <div class="phone">
    <div class="splash-bg" aria-hidden="true">
      <img class="splash-bg__pattern" src="../images/pattern.svg" alt="">
    </div>

    <div class="statusbar statusbar--light" aria-hidden="true">
      <span>9:41</span>
      <span class="statusbar__island"></span>
      <span class="statusbar__icons">
        <span class="statusbar__signal"><span></span><span></span><span></span><span></span></span>
        <span class="statusbar__wifi"></span>
        <span class="statusbar__battery"></span>
      </span>
    </div>

    <main class="content content--sticky splash">
      <h1 class="visually-hidden">CareCompare</h1>
      <div class="logo logo--lg logo--stacked logo--light">
        <span class="logo__mark"><span class="logo__icon i i-heart-pulse" aria-hidden="true"></span></span>
        <span class="logo__name">CareCompare</span>
      </div>
      <p class="body-text splash__tagline">Choose your doctor with confidence.</p>
      <div class="progress"><div class="progress__fill"></div></div>
    </main>

    <div class="sticky sticky--floating sticky--bare">
      <a class="btn btn--gold" href="02-welcome.html">Get started</a>
    </div>

    <span class="home-indicator" aria-hidden="true"></span>
  </div>
</body>
</html>
