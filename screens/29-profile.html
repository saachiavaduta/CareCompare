<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · DocCompare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23123F36'/%3E%3Cg fill='none' stroke='%23C49A45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 19s-6.5-4-8-8C3.1 8.3 4.9 6 7.5 6c1.7 0 3 1 4.5 2.6C13.5 7 14.8 6 16.5 6 19.1 6 20.9 8.3 20 11c-1.5 4-8 8-8 8z'/%3E%3Cpath d='M4 12.5h3.5l1.5-2.5 2.5 5 1.5-2.5H20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/screens.css">
</head>
<body>
  <div class="phone">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="statusbar__icons">
        <span class="statusbar__signal"><span></span><span></span><span></span><span></span></span>
        <span class="statusbar__wifi"></span>
        <span class="statusbar__battery"></span>
      </span>
    </div>

    <main class="content content--nav">
      <div class="profile-head">
        <span class="avatar avatar--lg avatar--gold-ring" aria-hidden="true">AM</span>
        <h1 class="heading-title">Aarav Mehta</h1>
        <p class="small-text muted-text">+91 00000 00000</p>
      </div>

      <button type="button" class="btn btn--ghost">
        <span class="i i-edit" aria-hidden="true"></span>Edit profile
      </button>

      <div class="stat-grid">
        <div class="card stat">
          <span class="stat__value">4</span>
          <span class="stat__label">Visits</span>
        </div>
        <div class="card stat">
          <span class="stat__value">3</span>
          <span class="stat__label">Saved</span>
        </div>
        <div class="card stat">
          <span class="stat__value">2</span>
          <span class="stat__label">Reviews</span>
        </div>
      </div>

      <div class="card card--list">
        <div class="list-row">
          <span class="icon-circle icon-circle--sm"><span class="i i-users" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Family members</span>
            <span class="list-row__sub">3 people</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </div>
        <div class="list-row">
          <span class="icon-circle icon-circle--sm"><span class="i i-settings" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Preferences</span>
            <span class="list-row__sub">Language, area, budget</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </div>
        <a class="list-row" href="11-doctor-profile.html">
          <span class="icon-circle icon-circle--sm"><span class="i i-heart" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Saved doctors</span>
            <span class="list-row__sub">3 saved</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </a>
        <a class="list-row" href="28-notifications.html">
          <span class="icon-circle icon-circle--sm"><span class="i i-bell" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Notifications</span>
            <span class="list-row__sub">Visits and reminders</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </a>
        <div class="list-row">
          <span class="icon-circle icon-circle--sm"><span class="i i-lock" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Settings and privacy</span>
            <span class="list-row__sub">Reminders, data</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </div>
        <div class="list-row">
          <span class="icon-circle icon-circle--sm"><span class="i i-help" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Help and support</span>
            <span class="list-row__sub">FAQs and helpline</span>
          </span>
          <span class="i i-chevron-right list-row__chevron" aria-hidden="true"></span>
        </div>
      </div>

      <a class="btn btn--ghost" href="04-login.html">
        <span class="i i-logout" aria-hidden="true"></span>Log out
      </a>
    </main>

    <nav class="nav" aria-label="Main">
      <div class="nav__items">
        <a class="nav__item" href="05-home.html">
          <span class="nav__pill"><span class="i i-home" aria-hidden="true"></span></span>Home
        </a>
        <a class="nav__item" href="06-search.html">
          <span class="nav__pill"><span class="i i-search" aria-hidden="true"></span></span>Search
        </a>
        <a class="nav__item" href="23-appointments.html">
          <span class="nav__pill"><span class="i i-calendar" aria-hidden="true"></span></span>Visits
        </a>
        <a class="nav__item nav__item--active" href="29-profile.html" aria-current="page">
          <span class="nav__pill"><span class="i i-user" aria-hidden="true"></span></span>Profile
        </a>
      </div>
    </nav>

    <span class="home-indicator" aria-hidden="true"></span>
  </div>
</body>
</html>
