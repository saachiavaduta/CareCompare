<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CareCompare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23123F36'/%3E%3Cg fill='none' stroke='%23C49A45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 19s-6.5-4-8-8C3.1 8.3 4.9 6 7.5 6c1.7 0 3 1 4.5 2.6C13.5 7 14.8 6 16.5 6 19.1 6 20.9 8.3 20 11c-1.5 4-8 8-8 8z'/%3E%3Cpath d='M4 12.5h3.5l1.5-2.5 2.5 5 1.5-2.5H20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/screens.css">
</head>
<body>
  <div class="phone">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="statusbar__island"></span>
      <span class="statusbar__icons">
        <span class="statusbar__signal"><span></span><span></span><span></span><span></span></span>
        <span class="statusbar__wifi"></span>
        <span class="statusbar__battery"></span>
      </span>
    </div>

    <main class="content content--sticky">
      <header class="header">
        <a class="round-button" href="05-home.html" aria-label="Back">
          <span class="round-button__face"><span class="i i-arrow-left" aria-hidden="true"></span></span>
        </a>
        <h1 class="header__title">Notifications</h1>
        <span class="round-button" aria-hidden="true"></span>
      </header>

      <div class="chip-row chip-row--wrap">
        <span class="chip chip--active"><span class="chip__face">All</span></span>
        <span class="chip"><span class="chip__face">Visits</span></span>
        <span class="chip"><span class="chip__face">Offers</span></span>
      </div>

      <div class="card card--list">
        <a class="list-row notice-row notice-row--unread" href="24-appointment-tracker.html">
          <span class="notice-row__dot" aria-hidden="true"></span>
          <span class="icon-circle icon-circle--sm"><span class="i i-calendar" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Visit tomorrow at 10:30 AM</span>
            <span class="list-row__sub">Dr. Rao · 1 hour ago</span>
          </span>
        </a>
        <a class="list-row notice-row notice-row--unread" href="24-appointment-tracker.html">
          <span class="notice-row__dot" aria-hidden="true"></span>
          <span class="icon-circle icon-circle--sm"><span class="i i-check-circle" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Booking confirmed</span>
            <span class="list-row__sub">CC-1024 · Yesterday</span>
          </span>
        </a>
        <a class="list-row notice-row notice-row--read" href="26-visit-summary.html">
          <span class="notice-row__dot" aria-hidden="true"></span>
          <span class="icon-circle icon-circle--sm"><span class="i i-clock" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Follow-up due Fri 30 Oct</span>
            <span class="list-row__sub">2 days ago</span>
          </span>
        </a>
        <a class="list-row notice-row notice-row--read" href="14-compare-select.html">
          <span class="notice-row__dot" aria-hidden="true"></span>
          <span class="icon-circle icon-circle--sm"><span class="i i-copy" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Compare doctors with family</span>
            <span class="list-row__sub">Tip · 3 days ago</span>
          </span>
        </a>
        <div class="list-row notice-row notice-row--read">
          <span class="notice-row__dot" aria-hidden="true"></span>
          <span class="icon-circle icon-circle--sm"><span class="i i-shield-check" aria-hidden="true"></span></span>
          <span class="list-row__body">
            <span class="list-row__label">Your review was posted</span>
            <span class="list-row__sub">Dr. Iyer · 2 Sep</span>
          </span>
        </div>
      </div>
    </main>

    <div class="sticky sticky--floating">
      <a class="btn btn--primary" href="05-home.html">Mark all as read</a>
    </div>

    <span class="home-indicator" aria-hidden="true"></span>
  </div>
</body>
</html>
